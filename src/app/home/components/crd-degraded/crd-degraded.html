<div class="crd-degraded-container">
  <img [src]="crdImage" [alt]="crdAlt" class="image"/>
  <div class="text-section">
    <p class="title">{{ crdTitle }}</p>
    <p class="subtitle">{{ crdSubtitle }}</p>
  </div>
  <div class="button">
    <shared-btn-icon
      [btnText]="btnText"
      [btnIcon]="btnIcon"
      [btnStyle]="'2'"
      [btnGoToURL]="btnGoToURL"
    ></shared-btn-icon>
  </div>
</div>
